[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-memory"
version = "1.0.0"
description = "🧠 A lightweight, local SQLite FTS5 memory hub for AI coding agents to remember context across sessions."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Varun Ruhella" }]
keywords = ["ai", "memory", "sqlite", "cursor", "claude", "agent", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
agent-memory = "local_agent_memory.cli:main"
amem = "local_agent_memory.cli:main"

[project.urls]
Homepage = "https://github.com/varungor365/local-agent-memory"
Repository = "https://github.com/varungor365/local-agent-memory"
